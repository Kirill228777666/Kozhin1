<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NeuroSphere · AI Чат
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >


    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }


        body {

            font-family:
                'Inter',
                sans-serif;

            background:
                #0b0f14;

            height: 100vh;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            position: relative;
        }


        .bg-gradient {

            position: fixed;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    ellipse at 40% 50%,
                    #142433,
                    #05080c
                );

            z-index: -2;
        }


        .glow {

            position: absolute;

            width: 70vw;
            height: 70vh;

            background:
                #2a5f8f;

            filter:
                blur(130px);

            opacity: 0.2;

            border-radius: 50%;

            top: 10%;
            left: 15%;

            animation:
                slow-drift 20s
                infinite alternate;

            z-index: -1;
        }


        .glow.second {

            background:
                #7b4f9a;

            width: 50vw;
            height: 50vh;

            right: 5%;
            bottom: 5%;

            left: auto;
            top: auto;

            animation-duration:
                25s;

            opacity: 0.15;
        }


        @keyframes slow-drift {

            0% {

                transform:
                    translate(0, 0);
            }

            100% {

                transform:
                    translate(5%, 5%);
            }
        }


        header {

            background:
                rgba(15, 25, 35, 0.5);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.06);

            padding:
                12px 32px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            z-index: 10;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .brand i {

            font-size: 28px;

            color: #7aa9ff;
        }


        .brand span {

            font-size: 22px;

            font-weight: 700;

            color: white;

            letter-spacing:
                -0.5px;
        }


        .user-profile {

            display: flex;

            align-items: center;

            gap: 12px;

            cursor: pointer;

            padding:
                6px 16px
                6px 12px;

            background:
                rgba(255,255,255,0.05);

            border-radius: 40px;

            border:
                1px solid
                rgba(255,255,255,0.05);

            transition:
                background 0.2s;
        }


        .user-profile:hover {

            background:
                rgba(255,255,255,0.12);
        }


        .user-name {

            color: white;

            font-weight: 500;
        }


        .avatar {

            width: 40px;
            height: 40px;

            background:
                linear-gradient(
                    145deg,
                    #4d7fff,
                    #6d5df0
                );

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-weight: 600;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.3);
        }


        .chat-container {

            flex: 1;

            display: flex;

            flex-direction: column;

            max-width: 1000px;

            margin:
                20px auto;

            width: 100%;

            padding:
                0 20px;

            z-index: 5;
        }


        .chat-messages {

            flex: 1;

            overflow-y: auto;

            padding:
                20px 10px;

            display: flex;

            flex-direction: column;

            gap: 16px;

            scroll-behavior:
                smooth;
        }


        .message {

            display: flex;

            align-items:
                flex-start;

            gap: 12px;

            max-width: 80%;

            animation:
                message-fade
                0.3s ease-out;
        }


        .message.ai {

            align-self:
                flex-start;
        }


        .message.user {

            align-self:
                flex-end;

            flex-direction:
                row-reverse;
        }


        .message-avatar {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.1);

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            flex-shrink: 0;

            backdrop-filter:
                blur(4px);
        }


        .message.user .message-avatar {

            background:
                #3a6ab5;
        }


        .bubble {

            background:
                rgba(25, 40, 55, 0.7);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            padding:
                14px 20px;

            border-radius:
                22px;

            border-bottom-left-radius:
                4px;

            color:
                rgba(255,255,255,0.95);

            box-shadow:
                0 8px 20px -6px
                rgba(0,0,0,0.3);

            border:
                1px solid
                rgba(255,255,255,0.04);

            line-height: 1.5;
        }


        .message.user .bubble {

            background:
                linear-gradient(
                    145deg,
                    #2a5f9a,
                    #1e3a63
                );

            border-bottom-right-radius:
                4px;

            border-bottom-left-radius:
                22px;

            border:
                1px solid
                rgba(255,255,255,0.1);
        }


        .chat-input-area {

            background:
                rgba(20, 30, 40, 0.5);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border-radius: 60px;

            padding:
                8px 8px
                8px 24px;

            display: flex;

            align-items: center;

            gap: 8px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            margin:
                20px 0 10px;

            box-shadow:
                0 15px 30px -10px
                rgba(0,0,0,0.5);
        }


        .chat-input-area textarea {

            flex: 1;

            background:
                transparent;

            border:
                none;

            outline:
                none;

            color:
                white;

            font-size:
                16px;

            padding:
                14px 0;

            resize:
                none;

            max-height:
                120px;

            font-family:
                'Inter',
                sans-serif;
        }


        .chat-input-area textarea::placeholder {

            color:
                rgba(255,255,255,0.4);
        }


        .send-btn {

            width: 54px;
            height: 54px;

            border-radius: 50%;

            background:
                #3a7bd5;

            border:
                none;

            color:
                white;

            font-size:
                20px;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transition:
                all 0.2s;

            box-shadow:
                0 0 15px
                rgba(58,123,213,0.5);

            border:
                1px solid
                rgba(255,255,255,0.2);
        }


        .send-btn:hover {

            background:
                #4d8ef0;

            transform:
                scale(1.05);

            box-shadow:
                0 0 25px
                #3a7bd5;
        }


        .send-btn i {

            transition:
                transform 0.2s;
        }


        .send-btn:hover i {

            transform:
                translateX(2px);
        }


        @keyframes message-fade {

            from {

                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .chat-messages::-webkit-scrollbar {

            width: 6px;
        }


        .chat-messages::-webkit-scrollbar-track {

            background:
                rgba(255,255,255,0.02);

            border-radius:
                10px;
        }


        .chat-messages::-webkit-scrollbar-thumb {

            background:
                rgba(255,255,255,0.2);

            border-radius:
                10px;
        }


        @media (
            max-width: 700px
        ) {

            header {

                padding:
                    10px 16px;
            }


            .chat-container {

                padding:
                    0 12px;
            }


            .message {

                max-width:
                    90%;
            }


            .user-name {

                display:
                    none;
            }
        }

    </style>

</head>


<body>


    <div class="bg-gradient"></div>

    <div class="glow"></div>

    <div class="glow second"></div>


    <header>


        <div class="brand">

            <i class="fas fa-brain"></i>

            <span>
                NeuroSphere AI
            </span>

        </div>


        <div
            class="user-profile"
            onclick="location.href='{{ url_for('lk') }}'"
        >

            <span class="user-name">
                {{ user_name }}
            </span>


            <div class="avatar">

                <i
                    class="fas fa-user-astronaut">
                </i>

            </div>

        </div>


    </header>


    <div class="chat-container">


        <div
            class="chat-messages"
            id="chatMessages"
        >


            <div class="message ai">


                <div class="message-avatar">

                    <i class="fas fa-robot"></i>

                </div>


                <div class="bubble">

                    Привет, {{ user_name }}!
                    Я NeuroSphere AI.
                    Чем могу помочь?

                </div>


            </div>


        </div>


        <div class="chat-input-area">


            <textarea
                id="userInput"
                placeholder="Введите сообщение..."
                rows="1">
            </textarea>


            <button
                class="send-btn"
                id="sendBtn"
            >

                <i class="fas fa-arrow-up"></i>

            </button>


        </div>


    </div>


    <script>


        const chatMessages =
            document.getElementById(
                'chatMessages'
            );


        const userInput =
            document.getElementById(
                'userInput'
            );


        const sendBtn =
            document.getElementById(
                'sendBtn'
            );


        function addMessage(
            text,
            sender
        ) {

            const msgDiv =
                document.createElement(
                    'div'
                );


            msgDiv.classList.add(
                'message',
                sender
            );


            const avatar =
                document.createElement(
                    'div'
                );


            avatar.classList.add(
                'message-avatar'
            );


            avatar.innerHTML =
                sender === 'ai'
                    ? '<i class="fas fa-robot"></i>'
                    : '<i class="fas fa-user"></i>';


            const bubble =
                document.createElement(
                    'div'
                );


            bubble.classList.add(
                'bubble'
            );


            bubble.textContent =
                text;


            msgDiv.appendChild(
                avatar
            );


            msgDiv.appendChild(
                bubble
            );


            chatMessages.appendChild(
                msgDiv
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;
        }


        async function sendMessage() {

            const text =
                userInput.value.trim();


            if (!text) {

                return;
            }


            addMessage(
                text,
                'user'
            );


            userInput.value =
                '';


            userInput.style.height =
                'auto';


            setTimeout(
                () => {

                    addMessage(
                        'Это демо-ответ нейросети. В реальном приложении здесь будет ответ от API.',
                        'ai'
                    );

                },
                800
            );
        }


        sendBtn.addEventListener(
            'click',
            sendMessage
        );


        userInput.addEventListener(
            'keydown',
            (e) => {

                if (
                    e.key === 'Enter'
                    && !e.shiftKey
                ) {

                    e.preventDefault();

                    sendMessage();
                }
            }
        );


        userInput.addEventListener(
            'input',
            function () {

                this.style.height =
                    'auto';


                this.style.height =
                    this.scrollHeight
                    + 'px';
            }
        );


    </script>


</body>

</html>
