<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация · NeuroSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0c0f;
            position: relative;
            overflow-x: hidden;
        }
        .background { position: fixed; width: 100vw; height: 100vh; background: radial-gradient(circle at 70% 20%, #1e2a4a, #0c101c); z-index: -2; }
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: float 14s infinite alternate ease-in-out;
            z-index: -1;
        }
        .orb-1 { width: 650px; height: 650px; background: #c44dff; top: -100px; right: -100px; }
        .orb-2 { width: 450px; height: 450px; background: #2a9d8f; bottom: -80px; left: -50px; animation-duration: 18s; }
        .orb-3 { width: 250px; height: 250px; background: #e9c46a; top: 30%; left: 20%; animation-duration: 8s; }
        @keyframes float {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }
        .reg-card {
            width: 480px;
            background: rgba(18, 28, 40, 0.5);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 36px;
            padding: 40px;
            box-shadow: 0 30px 50px -15px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06) inset;
            border: 1px solid rgba(255,255,255,0.05);
            animation: card-appear 0.6s ease-out;
        }
        @keyframes card-appear {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .logo-icon { font-size: 28px; color: #a78bfa; }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #d9c9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h2 {
            color: white;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            margin-bottom: 28px;
            font-weight: 300;
        }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.45);
            font-size: 18px;
            transition: color 0.2s;
            z-index: 2;
        }
        .input-group input {
            width: 100%;
            background: rgba(8, 18, 28, 0.5);
            border: 1.5px solid rgba(255,255,255,0.1);
            padding: 15px 20px 15px 52px;
            border-radius: 30px;
            font-size: 15px;
            color: white;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
        }
        .input-group input:focus {
            border-color: #a78bfa;
            background: rgba(20,35,55,0.7);
            box-shadow: 0 0 0 4px rgba(167,139,250,0.15);
        }
        .input-group input:focus + i {
            color: #a78bfa;
        }
        .input-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn-register {
            width: 100%;
            background: linear-gradient(145deg, #8b5cf6, #6d28d9);
            border: none;
            padding: 16px;
            border-radius: 34px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 12px 20px -8px rgba(139,92,246,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-register i {
            font-size: 16px;
        }
        .btn-register:hover {
            background: linear-gradient(145deg, #9f7aea, #7c3aed);
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -6px rgba(124,58,237,0.6);
        }
        .login-link {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.6);
        }
        .login-link a {
            color: #c4b5fd;
            font-weight: 600;
            text-decoration: none;
            margin-left: 6px;
            border-bottom: 1px dotted rgba(196,181,253,0.5);
        }
        .login-link a:hover { color: white; border-bottom-color: white; }
        .error-banner {
            background: rgba(255,80,80,0.15);
            border-left: 4px solid #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .error-banner div {
            color: #ff8a8a;
            font-size: 14px;
            margin-bottom: 4px;
        }
        @media (max-width: 550px) {
            .reg-card { width: 90%; padding: 30px 24px; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>

    <div class="reg-card">
        <div class="logo">
            <i class="fas fa-cloud-upload-alt logo-icon"></i>
            <span class="logo-text">NeuroSphere</span>
        </div>
        <h2>Создать аккаунт</h2>
        <div class="subtitle">Присоединяйтесь к будущему</div>

        {% if errors %}
        <div class="error-banner">
            {% for error in errors %}
                <div><i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>{{ error }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="/registration">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="name" placeholder="Ваше имя" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Придумайте пароль" required>
            </div>
            <button type="submit" class="btn-register">
                Зарегистрироваться <i class="fas fa-rocket"></i>
            </button>
            <div class="login-link">
                Уже есть аккаунт? <a href="/">Войти</a>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
