<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление · NeuroSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0c0f;
            position: relative;
        }
        .background { position: fixed; width: 100vw; height: 100vh; background: radial-gradient(circle at 30% 70%, #1e2a3a, #080b12); z-index: -2; }
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float 16s infinite alternate;
            z-index: -1;
        }
        .orb-1 { width: 550px; height: 550px; background: #2ec4b6; bottom: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: #e71d36; top: -80px; right: -60px; animation-duration: 12s; }
        @keyframes float {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(-30px, 20px) scale(1.1); }
        }
        .reset-card {
            width: 440px;
            background: rgba(22, 34, 48, 0.4);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 38px;
            padding: 42px 38px;
            box-shadow: 0 30px 40px -12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06) inset;
            border: 1px solid rgba(255,255,255,0.04);
            animation: fade 0.5s ease-out;
        }
        @keyframes fade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; }
        .logo-icon { font-size: 26px; color: #ffb703; }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(145deg, #fff, #ffe8b5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h2 { color: white; font-size: 30px; font-weight: 600; margin-bottom: 8px; }
        .desc {
            color: rgba(255,255,255,0.6);
            margin-bottom: 32px;
            font-size: 15px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 28px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 18px;
        }
        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.25);
            border: 1.5px solid rgba(255,255,255,0.1);
            padding: 16px 20px 16px 54px;
            border-radius: 32px;
            color: white;
            font-size: 15px;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #ffb703;
            background: rgba(20,30,45,0.7);
            box-shadow: 0 0 0 4px rgba(255,183,3,0.15);
        }
        .input-group input:focus + i { color: #ffb703; }
        .btn-send {
            width: 100%;
            background: linear-gradient(145deg, #ffb703, #fb8500);
            border: none;
            padding: 16px;
            border-radius: 34px;
            font-weight: 700;
            font-size: 16px;
            color: #0a0c0f;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(251,133,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-send i { font-size: 16px; }
        .btn-send:hover {
            background: linear-gradient(145deg, #ffc300, #f48c06);
            transform: scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(251,133,0,0.5);
        }
        .back-link {
            text-align: center;
            margin-top: 28px;
        }
        .back-link a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
            border-bottom: 1px dotted rgba(255,255,255,0.3);
        }
        .back-link a:hover { color: white; border-bottom-color: white; }
        .error-banner {
            background: rgba(255,80,80,0.15);
            border-left: 4px solid #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ff8a8a;
            font-size: 14px;
        }
        .success-banner {
            background: rgba(80,200,120,0.15);
            border-left: 4px solid #6fcf97;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #6fcf97;
            font-size: 14px;
        }
        @media (max-width: 500px) {
            .reset-card { width: 90%; padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <div class="reset-card">
        <div class="logo">
            <i class="fas fa-key logo-icon"></i>
            <span class="logo-text">NeuroSphere</span>
        </div>
        <h2>Сброс пароля</h2>
        <div class="desc">
            Введите email, указанный при регистрации. Мы отправим ссылку для восстановления.
        </div>

        {% if error %}
        <div class="error-banner">
            <i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>{{ error }}
        </div>
        {% endif %}
        {% if success %}
        <div class="success-banner">
            <i class="fas fa-check-circle" style="margin-right: 8px;"></i>{{ success }}
        </div>
        {% endif %}

        <form method="POST" action="/password_vosst">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <button type="submit" class="btn-send">
                Отправить <i class="fas fa-paper-plane"></i>
            </button>
            <div class="back-link">
                <a href="/"><i class="fas fa-arrow-left"></i> Вернуться ко входу</a>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
